{% set name = "chemlite" %}
{% set version = "2.8.0" %}
{% set python_min = "3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/brsynth/{{ name }}/archive/{{ version }}.tar.gz
  sha256: c4a6e52b2f5c04b6447c432512b1f35a2a14ad8670af076979d2e91401c2592f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} setup.py install

requirements:
  host:
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - brs_utils

test:
  source_files:
    - tests
  imports:
    - chemlite
  requires:
    - pytest
  commands:
    - cd tests
    - pytest -v

about:
  home: https://github.com/brsynth/chemlite
  summary: Basic representation of compounds, reactions, pathways
  license: MIT
  license_file: LICENSE
  doc_url: https://brsynth.github.io/chemlite
  dev_url: https://github.com/brsynth/chemlite

extra:
  recipe-maintainers:
    - breakthewall
    - ramez17khaled
